name: CD - Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality-gates:
    name: Engineering Quality Gates
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish Platform Release

    needs:
      - quality-gates

    runs-on: ubuntu-latest

    environment:
      name: release

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" \
            "origin/main"; then

            echo "Tagged commit is not contained in main."
            exit 1
          fi

      - name: Create release package
        shell: bash
        run: |
          mkdir -p dist

          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="agentic-engineering-platform-${VERSION}.tar.gz"

          tar \
            --exclude='evidence/generated' \
            --exclude='.git' \
            -czf "dist/$ARCHIVE" \
            AGENTS.md \
            skills \
            standards \
            policies \
            controls \
            evidence \
            docs \
            scripts \
            templates \
            tests \
            requirements-ci.txt

          (
            cd dist
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="agentic-engineering-platform-${VERSION}.tar.gz"

          gh release create "$VERSION" \
            "dist/$ARCHIVE" \
            "dist/$ARCHIVE.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Agentic Engineering Platform $VERSION"
